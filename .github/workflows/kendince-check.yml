name: Verify Kendince update
on:
  push:
    branches: [kendince-catalog-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify catalog and application flows
        run: node scripts/kendince/test.mjs
