name: Kendince catalog audit
on:
  push:
    branches: [main]
    paths: ['scripts/kendince/**', '.github/workflows/kendince-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kendince-catalog
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare first-party multi-store price and stock candidate
        run: python scripts/kendince/refresh-all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kendince-catalog-audit
          path: |
            kendince-audit/
          retention-days: 7
