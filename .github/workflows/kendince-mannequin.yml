name: Kendince mannequin review
on:
  push:
    branches: [kendince-mannequin-v3]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify application and mannequin flows
        run: node scripts/kendince/test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow cairosvg
      - run: python scripts/kendince/mannequin-assets.py
